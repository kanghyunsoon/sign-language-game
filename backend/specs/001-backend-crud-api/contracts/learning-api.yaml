openapi: 3.0.3
info:
  title: 학습 콘텐츠 / 테스트·오답노트 API (learning)
  version: "1.0.0"
  description: >
    카테고리별 콘텐츠 조회, 오답 신고/조회, 테스트 결과 보고. spec.md User Story 3 / FR-015~FR-018 대응.
tags:
  - name: Learning
paths:
  /signs:
    get:
      tags: [Learning]
      summary: 카테고리별 학습 콘텐츠 목록 조회
      operationId: listSigns
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SignCategory'
      responses:
        "200":
          description: 노출 가능한(is_active=true) 콘텐츠 목록 (FR-015)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignResponse'

  /wrong-answers:
    post:
      tags: [Learning]
      summary: 오답 신고
      operationId: reportWrongAnswer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrongAnswerRequest'
      responses:
        "201":
          description: 오답 기록 저장 (FR-016)
        "404":
          description: 존재하지 않는 콘텐츠 ID (Edge Case)
    get:
      tags: [Learning]
      summary: 카테고리별 최근 오답노트 조회
      operationId: listWrongAnswers
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SignCategory'
      responses:
        "200":
          description: 최근 신고순 최대 5건 (FR-017)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WrongAnswerResponse'

  /test-results:
    post:
      tags: [Learning]
      summary: 테스트 결과 보고
      operationId: reportTestResult
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestResultRequest'
      responses:
        "201":
          description: >
            결과 저장 (FR-018). 정답 수 기반 펫 경험치 반영은 1차 범위 제외(Out of Scope).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignCategory:
      type: string
      enum: [CONSONANT, VOWEL, NUMBER, WORD]
    SignResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        category:
          $ref: '#/components/schemas/SignCategory'
        label: { type: string }
        referenceMediaUrl: { type: string, nullable: true }
        tip: { type: string, nullable: true }
    WrongAnswerRequest:
      type: object
      required: [signId]
      properties:
        signId: { type: integer, format: int64 }
    WrongAnswerResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sign:
          $ref: '#/components/schemas/SignResponse'
        wrongAt: { type: string, format: date-time }
    TestResultRequest:
      type: object
      required: [category, totalCount, correctCount]
      properties:
        category:
          $ref: '#/components/schemas/SignCategory'
        totalCount: { type: integer, minimum: 0 }
        correctCount: { type: integer, minimum: 0 }
