openapi: 3.0.3
info:
  title: 랭킹 API (ranking)
  version: "1.0.0"
  description: >
    승수 기준 Top 5 랭킹과 본인 순위 조회. spec.md User Story 5 / FR-030~FR-033 대응.
tags:
  - name: Ranking
paths:
  /rankings:
    get:
      tags: [Ranking]
      summary: Top 5 랭킹 및 본인 순위 조회
      operationId: getRankings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            승수 내림차순 상위 5명(동점 시 패 수 적은 순, FR-032)과 요청자 본인 순위(FR-031).
            탈퇴한 사용자는 제외(FR-033).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RankingEntry:
      type: object
      properties:
        rank: { type: integer }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        winCount: { type: integer }
        lossCount: { type: integer }
    RankingResponse:
      type: object
      properties:
        top:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntry'
        me:
          $ref: '#/components/schemas/RankingEntry'
