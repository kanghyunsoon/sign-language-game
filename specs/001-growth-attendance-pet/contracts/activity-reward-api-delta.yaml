openapi: 3.0.3
info:
  title: 활동 완료·랭킹 API 성장 연동 델타
  version: "1.1.0"
  description: 테스트·솔로·1대1·랭킹 계약에서 성장 기능에 필요한 변경분
tags:
  - name: TestSessions
  - name: SoloResults
  - name: GameRooms
  - name: Ranking
paths:
  /test-sessions/{testSessionId}/complete:
    post:
      tags: [TestSessions]
      summary: 테스트 완료 및 조건부 성장 보상
      security: [{ bearerAuth: [] }]
      parameters:
        - name: testSessionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestCompletionRequest"
      responses:
        "200":
          description: 동일 payload 재전송도 200이며 XP는 최초 완료에서만 지급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCompletionResponse"
        "400": { description: 문항 수 또는 정답 수가 유효하지 않음 }
        "403": { description: 다른 사용자의 세션 }
        "404": { description: 세션 없음 }
        "409": { description: 완료된 세션에 기존과 다른 결과 제출 }
  /solo-results:
    post:
      tags: [SoloResults]
      summary: 솔로 완료 결과 저장 및 점수 구간별 성장 보상
      description: >
        신뢰 게임 서버가 사용자 Bearer 토큰과 함께 완료 결과를 한 번 전송한다.
        score는 게임 진행 시간(초)이며 낮을수록 좋은 기록이다.
        60 이하에는 XP 15, 90 이하에는 10, 120 이하에는 5, 그 외에는 0을 지급한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoloResultRequest"
      responses:
        "201":
          description: 솔로 결과와 펫 경험치를 같은 트랜잭션에서 반영
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoloResultResponse"
        "400": { description: score 누락 또는 양수가 아님 }
        "401": { description: 인증 필요 }
  /game-rooms/{roomId}/results:
    post:
      tags: [GameRooms]
      summary: 기존 1대1 결과 보고와 성장 보상 연동
      description: 정상 최초 결과만 승자 XP 10, 패자 XP 3을 같은 트랜잭션에서 반영한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "201": { description: 기존 GameResultResponse와 승자 ID 반환 }
        "409": { description: 이미 결과가 확정됐거나 결과 보고 불가능한 상태 }
  /rankings:
    get:
      tags: [Ranking]
      summary: 게임 종류별 Top 5 랭킹 및 본인 순위
      security: [{ bearerAuth: [] }]
      parameters:
        - name: gameType
          in: query
          required: true
          schema:
            type: string
            enum: [SIGN_DUEL, TETRIS_DUEL, TETRIS_SOLO]
      responses:
        "200":
          description: >
            TETRIS_SOLO는 사용자별 최소 score 오름차순과 공동 순위,
            대전은 승수 내림차순과 패수 오름차순으로 산정한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TestCompletionRequest:
      type: object
      required: [correctCount, totalCount]
      properties:
        correctCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 1 }
    TestCompletionResponse:
      type: object
      required:
        [testSessionId, completedAt, correctCount, totalCount,
         passedRewardThreshold, awardedExp, pet]
      properties:
        testSessionId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        correctCount: { type: integer }
        totalCount: { type: integer }
        passedRewardThreshold: { type: boolean }
        awardedExp: { type: integer, enum: [0, 7] }
        pet: { $ref: "#/components/schemas/PetStatusResponse" }
    SoloResultRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          description: 게임 진행 시간(초)
    SoloResultResponse:
      type: object
      required: [resultId, score]
      properties:
        resultId: { type: integer, format: int64 }
        score:
          type: integer
          minimum: 1
          description: 저장된 게임 진행 시간(초)
    RankingEntry:
      type: object
      required: [rank, userId, nickname, score]
      properties:
        rank: { type: integer, minimum: 1 }
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        score:
          type: integer
          description: 대전은 누적 승수, 솔로는 사용자별 최소 진행 시간(초)
    RankingResponse:
      type: object
      required: [top]
      properties:
        top:
          type: array
          items: { $ref: "#/components/schemas/RankingEntry" }
        me:
          allOf:
            - $ref: "#/components/schemas/RankingEntry"
          nullable: true
    PetStatusResponse:
      type: object
      required: [level, currentExp, evolutionStage, maxLevel]
      properties:
        level: { type: integer, minimum: 1, maximum: 20 }
        currentExp: { type: integer, minimum: 0, maximum: 19 }
        expToNextLevel:
          type: integer
          nullable: true
          description: 최대 레벨이면 null
        evolutionStage:
          type: string
          enum: [STAGE_1, STAGE_2, STAGE_3, STAGE_4, STAGE_5]
        maxLevel: { type: integer, enum: [20] }
