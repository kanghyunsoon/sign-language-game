[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerspelling-ai"
version = "0.2.0"
description = "MediaPipe image preprocessing for Korean fingerspelling"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "Pillow==10.4.0",
]

[project.scripts]
fingerspelling-data = "fingerspellingAi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
