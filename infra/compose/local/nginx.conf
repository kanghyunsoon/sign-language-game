# 로컬 테스트 스택 전용 nginx. 운영 서버의 "같은 오리진" 배치를 재현한다.
#   /            정적 프런트엔드 (SPA fallback)
#   /api/    ->  백엔드 8080   (REST + SSE + /api/ws/game-rooms)
#   /ai/ws   ->  지문자 AI 8765
#   /number  ->  숫자 AI 8766
#   /word    ->  단어 AI 8767
# 이 파일은 conf.d/ 안에 들어가므로 http 컨텍스트다. map 을 여기 둘 수 있다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 라우팅은 클라이언트가 하므로 없는 경로는 index.html 로 되돌린다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 프런트는 상대경로 "/api" 를 쓰고, 백엔드는 접두어 없이 "/auth/login" 으로 받는다.
    # proxy_pass 끝의 슬래시가 "/api" 를 떼는 역할을 한다.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 로비 SSE 와 게임방 WebSocket 이 끊기지 않도록 길게 잡고 버퍼링을 끈다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /ai/ws {
        proxy_pass http://ai:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /number {
        proxy_pass http://number-ai:8766/number;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /word {
        proxy_pass http://word-ai:8767/word;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
