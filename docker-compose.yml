services:
  mysql:
    image: mysql:8.4
    container_name: sudal-mysql
    restart: unless-stopped
    env_file:
      - /opt/sudal/.env
    volumes:
      - mysql_data:/var/lib/mysql
      - /opt/sudal/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  backend:
    image: sudal-backend:latest
    container_name: sudal-backend
    restart: unless-stopped
    env_file:
      - /opt/sudal/.env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  mysql_data: