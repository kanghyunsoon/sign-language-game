services:
  ai:
    image: sudal-ai:latest
    container_name: sudal-ai
    restart: unless-stopped
    init: true

    environment:
      HANDPRACTICE_AI_HOST: ${HANDPRACTICE_AI_HOST:-0.0.0.0}
      HANDPRACTICE_AI_PORT: ${HANDPRACTICE_AI_PORT:-8765}
      HANDPRACTICE_AI_MODEL: ${HANDPRACTICE_AI_MODEL:-baseline}
      # Decision-margin gate (top1 - top2). Raise to 0.3~0.4 to demand a more
      # precise handshape; 0 disables the gate. See game-ai-dev-server/README.md.
      HANDPRACTICE_AI_MIN_MARGIN: ${HANDPRACTICE_AI_MIN_MARGIN:-0.25}

    ports:
      - "127.0.0.1:${AI_PORT:-8765}:${AI_PORT:-8765}"

    volumes:
      - ${AI_MODEL_DIR:-/opt/sudal/ai/models}:/app/models:ro
  number-ai:
    image: sudal-number-ai:latest
    container_name: sudal-number-ai
    restart: unless-stopped
    init: true

    environment:
      HANDPRACTICE_NUMBER_HOST: 0.0.0.0
      HANDPRACTICE_NUMBER_PORT: 8766
      HANDPRACTICE_NUMBER_PATH: /number

    ports:
      - "127.0.0.1:8766:8766"