<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">지문자 모델 내부 평가</title>
  <desc id="desc">동일 촬영 영상을 학습과 평가로 나눴습니다. 정확도 98.42%, 평가 시퀀스 1,900개, 내부 출제 기준 통과 27개 자모. 신규 사용자 독립 평가가 아닙니다.</desc>
  <rect width="1200" height="310" rx="24" fill="#f8f5ef"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <text x="44" y="48" fill="#53473c" font-size="24" font-weight="700">지문자 모델 내부 평가</text>
    <text x="44" y="79" fill="#74675b" font-size="16">같은 촬영 영상의 앞 70% 학습 · 뒤 30% 평가 / 신규 사용자 독립 평가 아님</text>
    <g transform="translate(44 106)">
      <rect width="352" height="164" rx="16" fill="#fff" stroke="#e4dbce"/>
      <text x="24" y="37" fill="#74675b" font-size="18">최종 모델 정확도</text>
      <text x="24" y="100" fill="#a85d42" font-size="46" font-weight="700">98.42%</text>
      <text x="24" y="137" fill="#74675b" font-size="16">회전 증강 적용 모델</text>
    </g>
    <g transform="translate(424 106)">
      <rect width="352" height="164" rx="16" fill="#fff" stroke="#e4dbce"/>
      <text x="24" y="37" fill="#74675b" font-size="18">평가 시퀀스</text>
      <text x="24" y="100" fill="#53473c" font-size="46" font-weight="700">1,900</text>
      <text x="24" y="137" fill="#74675b" font-size="16">사용자 수가 아닌 입력 묶음 수</text>
    </g>
    <g transform="translate(804 106)">
      <rect width="352" height="164" rx="16" fill="#fff" stroke="#e4dbce"/>
      <text x="24" y="37" fill="#74675b" font-size="18">경쟁 모드 출제 자모</text>
      <text x="24" y="100" fill="#5f6f3e" font-size="46" font-weight="700">27 / 31</text>
      <text x="24" y="137" fill="#74675b" font-size="16">내부 정밀도·확정률 기준 통과</text>
    </g>
  </g>
</svg>
