<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">입력과 학습 조건을 바꾼 과정</title>
  <desc id="desc">손의 방향을 3D 입력에 담고, 2D와 3D 모델의 예측을 합친 뒤 회전 입력을 학습과 평가에 추가했습니다. 스크립트 작성과 튜닝에는 AI의 도움을 받았습니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a89a89"/></marker></defs>
  <rect width="1200" height="360" rx="24" fill="#f8f5ef"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <text x="44" y="49" fill="#53473c" font-size="25" font-weight="700">입력과 학습 조건을 바꾼 과정</text>
    <text x="44" y="79" fill="#74675b" font-size="16">AI로 스크립트를 수정하고, 인식 결과와 실험 기록을 비교했습니다.</text>
    <g transform="translate(44 111)">
      <rect width="332" height="177" rx="16" fill="#fff" stroke="#e4dbce"/>
      <text x="22" y="35" fill="#a85d42" font-size="17">01 / 방향 정보 추가</text>
      <text x="22" y="81" fill="#53473c" font-size="25" font-weight="700">3D 입력 78개</text>
      <text x="22" y="119" fill="#74675b" font-size="16">손가락 방향 · 관절 각도</text>
      <text x="22" y="147" fill="#74675b" font-size="16">손바닥이 향하는 방향</text>
    </g>
    <path d="M386 199H419" stroke="#a89a89" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(436 111)">
      <rect width="332" height="177" rx="16" fill="#fff" stroke="#e4dbce"/>
      <text x="22" y="35" fill="#5f6f3e" font-size="17">02 / 두 모델 결과 결합</text>
      <text x="22" y="81" fill="#53473c" font-size="25" font-weight="700">2D + 3D 모델</text>
      <text x="22" y="119" fill="#74675b" font-size="16">자모별 예측 확률을 절반씩 합산</text>
      <text x="22" y="147" fill="#74675b" font-size="16">혼동 자모의 학습 조건 조정</text>
    </g>
    <path d="M778 199H811" stroke="#a89a89" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(828 111)">
      <rect width="328" height="177" rx="16" fill="#fff" stroke="#e4dbce"/>
      <text x="22" y="35" fill="#a85d42" font-size="17">03 / 각도 변화 확인</text>
      <text x="22" y="81" fill="#53473c" font-size="25" font-weight="700">회전 입력 추가</text>
      <text x="22" y="119" fill="#74675b" font-size="16">학습 좌표에 회전 적용</text>
      <text x="22" y="147" fill="#74675b" font-size="16">±10° · ±20° 변형 입력 평가</text>
    </g>
    <text x="44" y="328" fill="#74675b" font-size="16">각 단계의 평가 조건과 배포 모델의 한계는 본문에 함께 적었습니다.</text>
  </g>
</svg>
