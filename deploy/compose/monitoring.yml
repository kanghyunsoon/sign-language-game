name: sudal-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: sudal-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - /opt/sudal/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - monitoring

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:12.4.3
    container_name: sudal-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - /opt/sudal/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/sudal/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - monitoring

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: sudal-node-exporter
    restart: unless-stopped

    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

    networks:
      - monitoring

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: sudal-cadvisor
    restart: unless-stopped
    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    devices:
      - /dev/kmsg:/dev/kmsg

    networks:
      - monitoring

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  monitoring:
    name: sudal-monitoring

volumes:
  prometheus_data:
  grafana_data: